# ==================================================
# SECURE PRODUCTION CONFIGURATION (RENDER + POSTGRESQL SSL)
# ==================================================

# Database Connectivity (Strict Environment Variables)
# Note: SPRING_DATASOURCE_URL on Render should include sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Secure Production Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server Network Config (Render Dynamic Port)
server.port=${PORT:8080}

# Security (Secrets from Environment)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Email Infrastructure (Environment Based)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
