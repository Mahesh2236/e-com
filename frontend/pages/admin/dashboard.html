<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMart Admin - Admin Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="admin-body bg-light">
    <div class="d-flex min-vh-100">
        <!-- Sidebar Placeholder -->
        <div id="admin-sidebar-placeholder" class="bg-white border-end shadow-sm" style="width: 250px;"></div>

        <!-- Main Content Wrapper -->
        <div class="flex-grow-1 d-flex flex-column">
            <!-- Admin Navbar Placeholder -->
            <div id="admin-navbar-placeholder" class="bg-white border-bottom shadow-sm p-3"></div>

            <main class="p-4 admin-main-content flex-grow-1">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Dashboard Overview</h2>
        </div>
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="glass-card p-4 text-center hover-scale">
                    <div class="text-muted small fw-bold mb-2">Total Sales</div>
                    <h3 class="fw-bold text-primary mb-0">$24,500</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card p-4 text-center hover-scale">
                    <div class="text-muted small fw-bold mb-2">Total Orders</div>
                    <h3 class="fw-bold mb-0">1,240</h3>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="glass-card h-100 p-4">
                    <h5 class="fw-bold mb-4">Revenue Analytics</h5>
                    <div class="bg-light rounded d-flex align-items-center justify-content-center text-muted w-100" style="height: 300px;">
                        [Chart.js Placeholder]
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="glass-card h-100 p-4">
                    <h5 class="fw-bold mb-4">Recent Orders</h5>
                    <div class="text-muted text-center py-5">[Orders Table Placeholder]</div>
                </div>
            </div>
        </div>
        
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/dashboard.js"></script>
</body>
</html>
