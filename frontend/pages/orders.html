<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMart - My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tracking.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    
    <!-- Navbar -->
    <header class="glass-nav sticky-top py-3 border-bottom border-light">
        <div class="container-fluid px-4 d-flex align-items-center gap-4">
            <a href="home.html" class="navbar-brand fw-bold fs-3 text-dark text-decoration-none">Quick<span style="color: var(--clr-soft-purple);">Mart</span></a>
            <div class="flex-grow-1 mx-md-3 d-none d-lg-flex">
                <div class="input-group shadow-sm" style="border-radius: var(--border-radius-sm); border: 1px solid var(--clr-lavender);">
                    <input type="text" class="form-control border-0 ps-3" placeholder="Search orders...">
                    <button class="btn px-4" style="background: var(--clr-soft-purple); border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0;">
                        <i class="fas fa-search text-white"></i>
                    </button>
                </div>
            </div>
            <a href="cart.html" class="d-flex align-items-end cursor-pointer hover-scale text-decoration-none text-dark position-relative ms-auto">
                <div class="position-relative">
                    <i class="fas fa-shopping-cart fa-2x" style="color: var(--clr-sky-blue);"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill cart-badge" style="background-color: var(--clr-peach); font-size: 0.7rem; border: 2px solid white;">0</span>
                </div>
                <span class="fw-bold ms-2 mb-1 d-none d-sm-inline">Cart</span>
            </a>
        </div>
    </header>

    <main class="page-transition-enter pt-4 mb-5 flex-grow-1">
        <div class="container px-4">
            <h2 class="fw-bold mb-4">Your Orders</h2>
            
            <div id="ordersContainer">
                <!-- JS will populate orders here -->
                <div class="text-center py-5 fade-in-up">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-white py-5 mt-auto" style="background: #232F3E;">
        <div class="container text-center">
            <p class="text-light small">&copy; 2026, QuickMart, Inc. or its affiliates</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/orders.js"></script>
</body>
</html>
