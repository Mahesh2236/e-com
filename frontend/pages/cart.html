<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMart - Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    
    <!-- Navbar -->
    <header class="glass-nav sticky-top py-3 border-bottom border-light">
        <div class="container-fluid px-4 d-flex align-items-center">
            <a href="../index.html" class="navbar-brand fw-bold fs-3 text-dark text-decoration-none">Quick<span style="color: var(--clr-soft-purple);">Mart</span></a>
            <div class="input-group d-none d-md-flex w-50 mx-auto shadow-sm" style="border-radius: var(--border-radius-sm); border: 1px solid var(--clr-lavender);">
                <input type="text" class="form-control border-0 ps-3" placeholder="Search...">
                <button class="btn px-4" style="background: var(--clr-soft-purple); border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0;"><i class="fas fa-search text-white"></i></button>
            </div>
            <a href="cart.html" class="d-flex align-items-end cursor-pointer hover-scale text-decoration-none text-dark position-relative ms-auto">
                <div class="position-relative">
                    <i class="fas fa-shopping-cart fa-2x" style="color: var(--clr-sky-blue);"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill cart-badge" style="background-color: var(--clr-peach); font-size: 0.7rem; border: 2px solid white;">0</span>
                </div>
                <span class="fw-bold ms-2 mb-1 d-none d-sm-inline">Cart</span>
            </a>
        </div>
    </header>

    <main class="page-transition-enter pt-4 mb-5 flex-grow-1">
        <div class="container-fluid px-4">
            <div class="row g-4">
                
                <!-- Left: Shopping Cart Items -->
                <div class="col-lg-9">
                    <div class="glass-card bg-white p-4 p-md-5 rounded-4 shadow-sm border-0 h-100">
                        <div class="d-flex justify-content-between align-items-end border-bottom border-light pb-3 mb-4">
                            <h2 class="fw-normal mb-0 text-dark">Shopping Cart</h2>
                            <span class="text-muted small">Price</span>
                        </div>

                        <div id="cartItemsContainer">
                            <!-- JS will populate cart items here -->
                            <div class="text-center py-5 text-muted">
                                <i class="fas fa-shopping-cart fa-3x mb-3" style="opacity: 0.2"></i>
                                <h4>Your QuickMart Cart is empty.</h4>
                                <a href="../index.html" class="btn btn-premium mt-3 rounded-pill px-4">Shop Now</a>
                            </div>
                        </div>

                        <!-- Subtotal Line -->
                        <div class="text-end mt-4 d-none" id="cartSubtotalContainer">
                            <span class="fs-5" id="cartSubtotalText">Subtotal (0 items): </span><span class="fs-5 fw-bold" id="cartSubtotalMain">₹0</span>
                        </div>

                    </div>
                </div>

                <!-- Right: Amazon Style Subtotal Buy Box -->
                <div class="col-lg-3">
                    <div class="glass-card bg-white p-4 rounded-4 shadow border border-light position-sticky" style="top: 100px;">
                        
                        <div class="d-flex align-items-center gap-2 mb-3 text-success">
                            <i class="fas fa-check-circle fs-5"></i>
                            <span class="small fw-bold">Your order qualifies for FREE Shipping.</span>
                        </div>
                        <div class="small text-muted mb-4 px-4">Choose this option at checkout. <a href="#" class="text-primary text-decoration-none">See details</a></div>

                        <div class="fs-5 text-center mb-4">
                            <span id="buyBoxSubtotalText">Subtotal (0 items):</span> <span class="fw-bold d-block fs-3 text-danger mt-1" id="buyBoxSubtotalMain">₹0</span>
                        </div>

                        <div class="form-check mb-4 ps-4">
                            <input class="form-check-input" type="checkbox" id="giftCheck">
                            <label class="form-check-label small" for="giftCheck">This order contains a gift</label>
                        </div>

                        <a href="checkout.html" id="proceedCheckoutBtn" class="btn w-100 rounded-pill py-2 shadow-sm mb-3 text-dark fw-bold disabled" style="background-color: #FFD814; border: 1px solid #FCD200;">Proceed to checkout</a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-white py-5 mt-auto" style="background: #232F3E;">
        <div class="container text-center">
            <p class="text-light small">&copy; 2026, QuickMart, Inc. or its affiliates</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/cart-page.js"></script>
</body>
</html>
