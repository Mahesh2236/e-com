<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMart - Products Search</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom Theme CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body class="bg-light">
    <!-- Amazon-Inspired Premium Navbar -->
    <header class="glass-nav sticky-top pb-0 border-bottom border-light">
        <div class="container-fluid pt-3 pb-2 px-4 d-flex align-items-center gap-3 gap-md-4">
            <a href="../index.html" class="navbar-brand fw-bold fs-3 text-dark text-decoration-none">Quick<span style="color: var(--clr-soft-purple);">Mart</span></a>
            
            <div class="flex-grow-1 mx-md-3 d-none d-lg-flex">
                <div class="input-group shadow-sm" style="border-radius: var(--border-radius-sm); border: 1px solid var(--clr-lavender);">
                    <select class="form-select bg-light border-0 fw-medium text-muted" style="max-width: 130px; border-radius: var(--border-radius-sm) 0 0 var(--border-radius-sm);">
                        <option>All Depts</option>
                    </select>
                    <input type="text" class="form-control border-0 ps-3" placeholder="Search premium products...">

                    <button class="btn px-4" style="background: var(--clr-soft-purple); border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0;">
                        <i class="fas fa-search text-white"></i>
                    </button>
                </div>
            </div>

            <div id="navAuthContainer" class="nav-right d-flex align-items-center gap-3 gap-md-4">
                <a href="login.html" class="d-none d-md-flex flex-column cursor-pointer hover-scale text-decoration-none text-dark">
                    <span class="text-muted" style="font-size: 0.75rem;">Hello, Sign in</span>
                    <span class="fw-bold fs-6">Account & Lists <i class="fas fa-caret-down small text-muted"></i></span>
                </a>
            </div>

            <a href="orders.html" class="d-none d-lg-flex flex-column cursor-pointer hover-scale text-decoration-none text-dark">
                <span class="text-muted" style="font-size: 0.75rem;">Returns</span>
                <span class="fw-bold fs-6">& Orders</span>
            </a>

            <a href="cart.html" class="d-flex align-items-end cursor-pointer hover-scale text-decoration-none text-dark position-relative">
                <div class="position-relative">
                    <i class="fas fa-shopping-cart fa-2x" style="color: var(--clr-sky-blue);"></i>
                    <span id="cartCountBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill" style="background-color: var(--clr-peach); font-size: 0.7rem; border: 2px solid white;">0</span>
                </div>
                <span class="fw-bold ms-2 mb-1 d-none d-sm-inline">Cart</span>
            </a>
        </div>
        <div class="container-fluid py-2 px-4 border-top border-light" style="background: rgba(255,255,255,0.4);">
            <div class="d-flex justify-content-between align-items-center small">
                <span class="text-muted fw-bold">Department > <span class="text-primary" id="breadcrumbCategory">All Departments</span></span>
                <select id="sortDropdown" class="form-select form-select-sm w-auto rounded-pill shadow-sm border-0 bg-white fw-bold">
                    <option value="featured" selected>Sort by: Featured</option>
                    <option value="price_low">Price: Low to High</option>
                    <option value="price_high">Price: High to Low</option>
                    <option value="rating">Avg. Customer Review</option>
                    <option value="newest">Newest Arrivals</option>
                </select>
            </div>
        </div>
    </header>

    <main class="page-transition-enter pt-4">
        <div class="container-fluid px-4 mb-5">
            <div class="row">
                
                <!-- Amazon-Style Filter Sidebar -->
                <div class="col-xl-2 col-lg-3 d-none d-lg-block fade-in-up">
                    <div class="glass-card bg-white p-4 position-sticky rounded-4 shadow-sm border-0" style="top: 130px;" id="sidebarFilters">
                        <!-- JS Dynamic Filters -->
                    </div>
                </div>

                <!-- Product Grid Container -->
                <div class="col-xl-10 col-lg-9 fade-in-up delay-1">
                    <div class="mb-3">
                        <span class="small text-muted fw-bold" id="resultsCount">Loading...</span>
                    </div>
                    <div class="row g-4" id="productGrid">
                        <!-- JS Dynamic Products -->
                    </div>
                    
                    <!-- Pagination -->
                    <div class="d-flex justify-content-center mt-5 mb-3 border-top border-light pt-4">
                        <nav aria-label="Search results pages">
                            <ul class="pagination pagination-lg border-0 shadow-sm rounded-pill overflow-hidden">
                                <li class="page-item disabled"><a class="page-link border-0 text-muted" href="#">Previous</a></li>
                                <li class="page-item active"><a class="page-link border-0" href="#" style="background: var(--clr-soft-purple); color: white;">1</a></li>
                                <li class="page-item"><a class="page-link border-0 text-dark" href="#">Next</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Component -->
    <footer class="text-white py-5 mt-auto" style="background: #232F3E;">
        <div class="container text-center">
            <a class="navbar-brand fw-bold fs-3 text-white text-decoration-none mb-3 d-inline-block" href="../index.html">Quick<span style="color: var(--clr-soft-purple);">Mart</span></a>
            <p class="text-light small">&copy; 2026, QuickMart, Inc. or its affiliates</p>
        </div>
    </footer>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/products.js"></script>
    <script>document.addEventListener("DOMContentLoaded", function() { if(typeof AOS !== 'undefined') AOS.init({ duration: 800, once: true }); });</script>
</body>
</html>
